name: FF14 Fish Alert

on:
  schedule:
    # 毎日 7:00 JST = 前日 22:00 UTC -> 土日祝はここでヌシ(24時間以内)を通知。平日はスキップ(夜枠が担当)
    - cron: '0 22 * * *'
    # 毎日 18:00 JST = 9:00 UTC -> 平日はここでヌシ(向こう7時間以内)を通知。土日祝はスキップ(朝枠が担当)
    - cron: '0 9 * * *'
    # 毎週月曜 7:00 JST = 日曜 22:00 UTC -> オオヌシ(7日以内)
    - cron: '0 22 * * 0'
  repository_dispatch:
    # Discordのスラッシュコマンド(/デイリー /ウィークリー)からCloudflare Workers経由で発火
    types: [discord-daily, discord-weekly]
  workflow_dispatch:
    inputs:
      mode:
        description: '手動実行時のモード'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - daily-morning
          - daily-evening
          - weekly

jobs:
  daily-morning:
    # 土日祝の朝7時枠(平日かどうかはPythonスクリプト側で判定してスキップします)
    if: github.event.schedule == '0 22 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'daily-morning')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python fish_monitor.py daily-morning
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

  daily-evening:
    # 平日の夜18時枠(土日祝かどうかはPythonスクリプト側で判定してスキップします)
    if: github.event.schedule == '0 9 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'daily-evening')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python fish_monitor.py daily-evening
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

  daily-manual:
    # 手動実行専用: 曜日を問わず24時間以内を通知
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'daily'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python fish_monitor.py daily
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

  weekly-oonushi:
    if: github.event.schedule == '0 22 * * 0' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'weekly')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python fish_monitor.py weekly
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

  discord-command:
    # Discordの /デイリー /ウィークリー コマンドから起動された場合
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run report for Discord command
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ "${{ github.event.action }}" = "discord-daily" ]; then
            python fish_monitor.py daily
          else
            python fish_monitor.py weekly
          fi
