name: FF14 Fish Alert

on:
  schedule:
    # 毎日 7:00 JST = 前日 22:00 UTC -> ヌシ(24時間以内)
    - cron: '0 22 * * *'
    # 毎週月曜 7:00 JST = 日曜 22:00 UTC -> オオヌシ(7日以内)
    - cron: '0 22 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: '手動実行時のモード'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - weekly

jobs:
  daily-nushi:
    if: github.event.schedule == '0 22 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'daily')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python fish_monitor.py daily
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

  weekly-oonushi:
    if: github.event.schedule == '0 22 * * 0' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'weekly')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python fish_monitor.py weekly
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
